<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;background:var(--z3-paper);">
<div id="root"></div>
<script type="text/babel">
const { Dialog, Toast, Tooltip, Button, IconButton } = window.Z3CollectiveDesignSystem_07fe72;
function InlineDialog() {
  // static rendering of the dialog card for the specimen (no overlay)
  return (
    <div style={{ background: "var(--surface-card)", border: "2px solid var(--z3-ink)", borderRadius: 16, boxShadow: "5px 5px 0 var(--z3-ink)", padding: 20, maxWidth: 320, fontFamily: "var(--font-body)" }}>
      <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 20 }}>Remove from cart?</div>
      <div style={{ fontSize: 14, color: "var(--text-muted)", margin: "6px 0 16px" }}>The Flexi Dragon goes back on the shelf.</div>
      <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
        <Button variant="ghost" size="sm">Keep it</Button>
        <Button size="sm">Remove</Button>
      </div>
    </div>
  );
}
function Demo() {
  return (
    <div style={{ padding: 16, display: "flex", gap: 20, alignItems: "flex-start", flexWrap: "wrap" }}>
      <InlineDialog />
      <div style={{ display: "grid", gap: 10 }}>
        <Toast tone="success">Added to cart. It clicks, by the way.</Toast>
        <Toast>Order printed. Ships tomorrow.</Toast>
        <Toast tone="danger">That one's sold out.</Toast>
        <div style={{ marginTop: 8 }}>
          <Tooltip text="Prints in ~4 hours">
            <Button variant="secondary" size="sm">Hover me</Button>
          </Tooltip>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
