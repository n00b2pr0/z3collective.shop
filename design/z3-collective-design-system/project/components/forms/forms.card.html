<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;background:var(--z3-paper);">
<div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.Z3CollectiveDesignSystem_07fe72;
function Demo() {
  const [wrap, setWrap] = React.useState(true);
  const [size, setSize] = React.useState("m");
  const [on, setOn] = React.useState(true);
  return (
    <div style={{ padding: 16, display: "grid", gap: 16 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
        <Input label="Email" placeholder="you@example.com" hint="For order updates only." />
        <Input label="Name" defaultValue="" error="We need this one." />
        <Select label="Line" options={["Dragons", "Dinos", "Critters", "Fidgets"]} />
      </div>
      <div style={{ display: "flex", gap: 24, alignItems: "center", flexWrap: "wrap" }}>
        <Checkbox label="Gift wrap it" checked={wrap} onChange={(e) => setWrap(e.target.checked)} />
        <Checkbox label="Disabled" disabled />
        <Radio name="size" label="Small" checked={size === "s"} onChange={() => setSize("s")} />
        <Radio name="size" label="Medium" checked={size === "m"} onChange={() => setSize("m")} />
        <Switch label="Email me restocks" checked={on} onChange={(e) => setOn(e.target.checked)} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
