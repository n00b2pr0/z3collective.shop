<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Crew Sign — Counter Card" description="Landscape 6.875x5.25in table/counter card — teal brand, headline + scannable QR, one clear action" -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  html,body{margin:0;padding:0;-webkit-font-smoothing:antialiased;}
  .cs-stage{min-height:100vh;background:#8a8a90;display:flex;align-items:center;justify-content:center;padding:44px;box-sizing:border-box;}
  #z3-qr canvas, #z3-qr img{display:block;width:100% !important;height:100% !important;border-radius:6px;}
  @page{size:6.875in 5.25in;margin:0;}
  @media print{
    .cs-stage{background:#fff;padding:0;min-height:auto;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</helmet>

<div class="cs-stage">
  <div style="position:relative;width:6.875in;height:5.25in;background:var(--z3-teal);box-sizing:border-box;display:flex;gap:0.4in;padding:0.55in;color:var(--z3-ink);font-family:var(--font-body);overflow:hidden;">

    <!-- left: message -->
    <div style="flex:1;display:flex;flex-direction:column;">
      <div>
        <span style="display:inline-flex;align-items:center;background:var(--z3-ink);color:var(--z3-paper);border-radius:999px;padding:5px 13px 6px;white-space:nowrap;font-family:var(--font-body);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:0.11em;">Custom 3D printed clickys</span>
      </div>
      <h1 style="margin:16px 0 0;font-family:var(--font-display);font-weight:700;font-size:47px;letter-spacing:-0.03em;line-height:1.0;text-wrap:balance;">Get your whole crew clicking.</h1>
      <p style="margin:12px 0 0;font-family:var(--font-body);font-weight:500;font-size:18px;line-height:1.35;color:var(--z3-ink);text-wrap:pretty;">Order custom 3D printed clickys for your team, family, or youth group. Or book a popup for parties and events.</p>

      <!-- footer -->
      <div style="margin-top:auto;display:flex;flex-direction:column;gap:7px;">
        <div style="display:inline-block;align-self:flex-start;white-space:nowrap;background:var(--z3-ink);color:var(--z3-paper);border-radius:8px;padding:5px 11px 6px;font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1;"><span style="letter-spacing:0.05em;">Z3</span> <span style="letter-spacing:-0.01em;">collective.</span></div>
        <span style="font-family:var(--font-body);font-weight:500;font-size:12.5px;color:var(--z3-ink);">Made to move by teens.</span>
      </div>
    </div>

    <!-- right: QR sticker -->
    <div style="display:flex;align-items:center;">
      <div style="background:var(--z3-white);border:2px solid var(--z3-ink);border-radius:14px;box-shadow:5px 5px 0 var(--z3-ink);padding:0.22in 0.24in 0.24in;display:flex;flex-direction:column;align-items:center;gap:11px;">
        <div style="font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-0.02em;line-height:1;color:var(--z3-ink);text-align:center;">Scan to get started</div>
        <div id="z3-qr" style="width:1.85in;height:1.85in;background:var(--z3-white);"></div>
        <!-- point your camera here -->
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <svg width="28" height="31" viewBox="0 0 30 34" fill="none" stroke="var(--z3-ink)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 32 C15 22, 15 14, 15 2"/><polyline points="7,9 15,1 23,9"/></svg>
          <span style="font-family:var(--font-body);font-weight:700;font-size:15px;line-height:1.15;color:var(--z3-ink-70);">Point your camera here</span>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 660, &quot;height&quot;: 504 },
  &quot;url&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://z3collective.com/start&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">
class Component extends DCLogic {
  componentDidMount() { this._draw(); }
  componentDidUpdate(prev) { if (prev.url !== this.props.url) this._draw(); }
  _draw() {
    const url = this.props.url || 'https://z3collective.com/start';
    const tick = () => {
      const el = document.getElementById('z3-qr');
      if (!el) return;
      if (!window.QRCode) { setTimeout(tick, 120); return; }
      el.innerHTML = '';
      new window.QRCode(el, {
        text: url, width: 420, height: 420,
        colorDark: '#0C0C11', colorLight: '#FFFFFF',
        correctLevel: window.QRCode.CorrectLevel.M
      });
    };
    tick();
  }
  renderVals() { return {}; }
}
</script>
</body>
</html>
