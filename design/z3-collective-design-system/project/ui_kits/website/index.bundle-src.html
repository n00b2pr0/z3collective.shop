<!-- @startingPoint section="Website" subtitle="Z3 shop site — home, line, product" viewport="1280x800" -->
<!DOCTYPE html>
<html><head>
<title>Z3 Collective — Shop</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;background:var(--z3-paper);">
<template id="__bundler_thumbnail" data-bg-color="#F4F4F7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect x="220" y="250" width="760" height="300" rx="40" fill="#0DCEC4" stroke="#0C0C11" stroke-width="8"/>
    <text x="600" y="470" text-anchor="middle" font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="150" letter-spacing="-6" fill="#0C0C11">z3<tspan fill="#F4F4F7">.</tspan></text>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel">
const NS = window.Z3CollectiveDesignSystem_07fe72;
const { WebsiteHome, WebsiteLine, WebsiteProduct, Toast, ToastStack } = NS;

function App() {
  const [route, setRoute] = React.useState({ screen: "home" });
  const [cart, setCart] = React.useState([]);
  const [toast, setToast] = React.useState(null);
  const navigate = (r) => { setRoute(typeof r === "string" ? { screen: r } : r); window.scrollTo(0, 0); };
  const addToCart = (p) => {
    setCart((c) => [...c, p]);
    setToast(`${p.name} is in the cart. It clicks, by the way.`);
    window.clearTimeout(addToCart._t);
    addToCart._t = window.setTimeout(() => setToast(null), 2600);
  };
  const common = { navigate, cartCount: cart.length };
  return (
    <div data-screen-label={route.screen}>
      {route.screen === "home" && <WebsiteHome {...common} />}
      {route.screen === "line" && <WebsiteLine {...common} line={route.line} />}
      {route.screen === "product" && <WebsiteProduct {...common} product={route.product} onAddToCart={addToCart} />}
      {toast ? <ToastStack><Toast tone="success">{toast}</Toast></ToastStack> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
