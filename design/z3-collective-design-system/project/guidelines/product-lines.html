<!-- @dsCard group="Brand" viewport="700x190" name="Product Lines" subtitle="Line + flair (flair is sign-only)" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);padding:16px;">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-body);">
  <div style="background:#fff;border:2px solid var(--z3-ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--z3-ink);">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--z3-dragons);border:2px solid var(--z3-ink);"></div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:16px;margin-top:8px;">Dragons</div>
    <div style="font-size:12px;color:var(--text-muted);">Spark & Scale</div>
  </div>
  <div style="background:#fff;border:2px solid var(--z3-ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--z3-ink);">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--z3-dinos);border:2px solid var(--z3-ink);"></div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:16px;margin-top:8px;">Dinos</div>
    <div style="font-size:12px;color:var(--text-muted);">Stomp & Roar</div>
  </div>
  <div style="background:#fff;border:2px solid var(--z3-ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--z3-ink);">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--z3-critters);border:2px solid var(--z3-ink);"></div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:16px;margin-top:8px;">Critters</div>
    <div style="font-size:12px;color:var(--text-muted);">Wild & Whimsy</div>
  </div>
  <div style="background:#fff;border:2px solid var(--z3-ink);border-radius:12px;padding:12px;box-shadow:3px 3px 0 var(--z3-ink);">
    <div style="width:28px;height:28px;border-radius:8px;background:var(--z3-fidgets);border:2px solid var(--z3-ink);"></div>
    <div style="font-family:var(--font-display);font-weight:700;font-size:16px;margin-top:8px;">Fidgets</div>
    <div style="font-size:12px;color:var(--text-muted);">Twist & Click</div>
  </div>
</div>
</body></html>
