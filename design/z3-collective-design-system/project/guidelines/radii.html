<!-- @dsCard group="Spacing" viewport="700x140" name="Radii" subtitle="6 / 10 / 16 / pill" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);padding:20px 24px;">
<div style="display:flex;gap:16px;align-items:center;font-family:var(--font-body);">
  <div style="width:120px;height:64px;background:#fff;border:2px solid var(--z3-ink);border-radius:var(--radius-sm);display:grid;place-items:center;font-size:12px;color:var(--text-muted);">sm · 6</div>
  <div style="width:120px;height:64px;background:#fff;border:2px solid var(--z3-ink);border-radius:var(--radius-md);display:grid;place-items:center;font-size:12px;color:var(--text-muted);">md · 10</div>
  <div style="width:120px;height:64px;background:#fff;border:2px solid var(--z3-ink);border-radius:var(--radius-lg);display:grid;place-items:center;font-size:12px;color:var(--text-muted);">lg · 16</div>
  <div style="width:140px;height:48px;background:var(--z3-teal);border:2px solid var(--z3-ink);border-radius:var(--radius-pill);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:14px;">pill · 999</div>
</div>
</body></html>
