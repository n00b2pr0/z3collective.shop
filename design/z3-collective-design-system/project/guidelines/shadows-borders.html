<!-- @dsCard group="Spacing" viewport="700x160" name="Sticker Shadow & Borders" subtitle="Hard offset, no blur — the signature" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);padding:24px;">
<div style="display:flex;gap:28px;align-items:center;font-family:var(--font-body);">
  <div style="width:150px;height:84px;background:#fff;border:2px solid var(--z3-ink);border-radius:16px;box-shadow:var(--shadow-sticker);display:grid;place-items:center;font-size:12px;color:var(--text-muted);">sticker · 3,3,0</div>
  <div style="width:150px;height:84px;background:#fff;border:2px solid var(--z3-ink);border-radius:16px;box-shadow:var(--shadow-sticker-lg);display:grid;place-items:center;font-size:12px;color:var(--text-muted);">sticker-lg · 5,5,0</div>
  <div style="width:150px;height:84px;background:#fff;border:1px solid var(--border-subtle);border-radius:16px;display:grid;place-items:center;font-size:12px;color:var(--text-muted);">quiet · 1px subtle</div>
</div>
</body></html>
