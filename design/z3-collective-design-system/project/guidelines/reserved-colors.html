<!-- @dsCard group="Colors" viewport="700x150" name="Reserved & Future" subtitle="Locked colors — do not use yet · targets Bambu PLA Matte" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;">
  <div style="border:2px dashed var(--z3-ink-45);border-radius:10px;overflow:hidden;background:#fff;display:flex;align-items:center;gap:12px;padding:12px;">
    <div style="width:56px;height:56px;border-radius:8px;background:var(--z3-candy);opacity:0.55;"></div>
    <div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:15px;">Candy <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#B392DE</span></div>
      <div style="font-size:13px;color:var(--text-muted);">Reserved — line not launched.</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--text-muted);"><span style="width:10px;height:10px;border-radius:50%;background:#AE96D4;border:1px solid var(--border-subtle);flex:none;"></span>PLA Matte Lilac Purple #AE96D4</div>
    </div>
  </div>
  <div style="border:2px dashed var(--z3-ink-45);border-radius:10px;overflow:hidden;background:#fff;display:flex;align-items:center;gap:12px;padding:12px;">
    <div style="width:56px;height:56px;border-radius:8px;background:var(--z3-yarn);opacity:0.55;"></div>
    <div>
      <div style="font-family:var(--font-display);font-weight:700;font-size:15px;">Yarn <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#F2A8CE</span></div>
      <div style="font-size:13px;color:var(--text-muted);">Future line — color locked.</div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--text-muted);"><span style="width:10px;height:10px;border-radius:50%;background:#E8AFCF;border:1px solid var(--border-subtle);flex:none;"></span>PLA Matte Sakura Pink #E8AFCF</div>
    </div>
  </div>
</div>
</body></html>
