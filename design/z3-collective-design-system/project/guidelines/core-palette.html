<!-- @dsCard group="Colors" viewport="700x150" name="Core Palette" subtitle="Ink, paper, teal — always safe" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;">
  <div style="border:2px solid var(--z3-ink);border-radius:10px;overflow:hidden;background:#fff;">
    <div style="height:72px;background:var(--z3-ink);"></div>
    <div style="padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:14px;">Ink <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#0C0C11</span></div>
  </div>
  <div style="border:2px solid var(--z3-ink);border-radius:10px;overflow:hidden;background:#fff;">
    <div style="height:72px;background:var(--z3-paper);border-bottom:1px solid var(--border-subtle);"></div>
    <div style="padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:14px;">Paper <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#F4F4F7</span></div>
  </div>
  <div style="border:2px solid var(--z3-ink);border-radius:10px;overflow:hidden;background:#fff;">
    <div style="height:72px;background:var(--z3-teal);"></div>
    <div style="padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:14px;">Teal <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#0DCEC4</span></div>
  </div>
  <div style="border:2px solid var(--z3-ink);border-radius:10px;overflow:hidden;background:#fff;">
    <div style="height:72px;background:#fff;border-bottom:1px solid var(--border-subtle);"></div>
    <div style="padding:8px 10px;font-family:var(--font-display);font-weight:700;font-size:14px;">White <span style="font-family:var(--font-body);font-weight:400;color:var(--text-muted);">#FFFFFF</span></div>
  </div>
</div>
</body></html>
