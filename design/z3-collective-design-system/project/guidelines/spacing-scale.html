<!-- @dsCard group="Spacing" viewport="700x140" name="Spacing Scale" subtitle="4px base, 9 steps" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:var(--z3-paper);padding:20px 24px;">
<div style="display:flex;align-items:flex-end;gap:14px;font-family:var(--font-body);">
  <div style="text-align:center;"><div style="width:4px;height:4px;background:var(--z3-teal);border-radius:2px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">1·4</div></div>
  <div style="text-align:center;"><div style="width:8px;height:8px;background:var(--z3-teal);border-radius:2px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">2·8</div></div>
  <div style="text-align:center;"><div style="width:12px;height:12px;background:var(--z3-teal);border-radius:3px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">3·12</div></div>
  <div style="text-align:center;"><div style="width:16px;height:16px;background:var(--z3-teal);border-radius:3px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">4·16</div></div>
  <div style="text-align:center;"><div style="width:24px;height:24px;background:var(--z3-teal);border-radius:4px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">5·24</div></div>
  <div style="text-align:center;"><div style="width:32px;height:32px;background:var(--z3-teal);border-radius:5px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">6·32</div></div>
  <div style="text-align:center;"><div style="width:48px;height:48px;background:var(--z3-teal);border-radius:6px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">7·48</div></div>
  <div style="text-align:center;"><div style="width:64px;height:64px;background:var(--z3-teal);border-radius:8px;margin:0 auto;"></div><div style="font-size:11px;color:var(--text-muted);margin-top:6px;">8·64</div></div>
</div>
</body></html>
