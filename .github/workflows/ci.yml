name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}

# NOTE: Dawn's stock CI also ran a Lighthouse job. It required Shopify store
# secrets (SHOP_STORE_OS2, SHOP_PASSWORD_OS2, SHOP_ACCESS_TOKEN, etc.) that this
# private repo doesn't have, so it failed on every run and was removed.
# To re-enable perf testing later: add those repo secrets and restore the
# `lhci` job from git history (git show 60e073f:.github/workflows/ci.yml).
